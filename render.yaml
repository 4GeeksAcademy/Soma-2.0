# Schema documented at https://render.com/docs/yaml-spec
services:
  - type: web # valid values: https://render.com/docs/yaml-spec#type
    region: ohio
    name: soma
    env: python # valid values: https://render.com/docs/yaml-spec#environment
    buildCommand: "./render_build.sh"
    startCommand: "gunicorn wsgi --chdir ./src/"
    plan: free # optional; defaults to starter
    numInstances: 1
    envVars:
      - key: VITE_BASENAME
        value: /
      - key: FLASK_APP
        value: src/app.py
      - key: FLASK_DEBUG
        value: 0
      - key: FLASK_APP_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.10.6
      - key: NODE_VERSION # package.json exige node >=20, el runtime nativo de Python no lo trae por defecto
        value: 20
      - key: DATABASE_URL # Render PostgreSQL database
        fromDatabase:
          name: soma-db
          property: connectionString
      - key: FRONTEND_URL # mismo dominio: el backend sirve el front compilado desde /dist
        value: https://soma.onrender.com
      - key: VITE_BACKEND_URL # variable de build de Vite, no se puede cambiar sin rebuild
        value: https://soma.onrender.com
      - key: GOOGLE_REDIRECT_URI
        value: https://soma.onrender.com/api/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false # pendiente: crear credenciales OAuth en Google Cloud Console
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USE_TLS
        value: "True"
      - key: MAIL_USERNAME
        sync: false # pendiente: cuenta Gmail + app password para envio de correo
      - key: MAIL_PASSWORD
        sync: false

databases: # Render PostgreSQL database
  - name: soma-db
    region: ohio
    ipAllowList: [] # only allow internal connections
    plan: free # optional; defaults to starter
