# Schema documented at https://render.com/docs/yaml-spec
services:
  - type: web # valid values: https://render.com/docs/yaml-spec#type
    region: ohio
    # "sample-service-name" y no "soma" a proposito: el servicio ya se creo en
    # Render con ese nombre placeholder (primer deploy hecho antes de
    # terminar este archivo) -- Render identifica el servicio existente por
    # este campo al sincronizar el Blueprint, asi que cambiarlo aqui crearia
    # un servicio nuevo duplicado en vez de actualizar el que ya esta corriendo
    # en sample-service-name-yu1j.onrender.com. Renombrar de verdad requiere
    # hacerlo desde el dashboard de Render, no solo aqui.
    name: sample-service-name
    env: python # valid values: https://render.com/docs/yaml-spec#environment
    buildCommand: "./render_build.sh"
    startCommand: "gunicorn wsgi --chdir ./src/"
    plan: free # optional; defaults to starter
    numInstances: 1
    envVars:
      - key: VITE_BASENAME
        value: /
      - key: FLASK_APP
        value: src/app.py
      - key: FLASK_DEBUG
        value: 0
      - key: FLASK_APP_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.10.6
      - key: NODE_VERSION # package.json exige node >=20, el runtime nativo de Python no lo trae por defecto
        value: 20
      - key: DATABASE_URL # Render PostgreSQL database
        fromDatabase:
          name: soma-db
          property: connectionString
      - key: FRONTEND_URL # mismo dominio: el backend sirve el front compilado desde /dist
        value: https://sample-service-name-yu1j.onrender.com
      - key: VITE_BACKEND_URL # variable de build de Vite, no se puede cambiar sin rebuild
        value: https://sample-service-name-yu1j.onrender.com
      - key: GOOGLE_REDIRECT_URI
        value: https://sample-service-name-yu1j.onrender.com/api/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false # pendiente: crear credenciales OAuth en Google Cloud Console
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Login con Google (issue #69) -- Client ID separado a proposito del de
      # Calendar de arriba. Mismo valor en las dos variables de abajo (el
      # mismo Client ID que GOOGLE_CLIENT_ID, si se reusa una sola credencial
      # de Google Cloud para las dos cosas -- ver .env.example).
      - key: GOOGLE_AUTH_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_AUTH_CLIENT_ID
        sync: false
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USE_TLS
        value: "True"
      - key: MAIL_USERNAME
        sync: false # pendiente: cuenta Gmail + app password para envio de correo
      - key: MAIL_PASSWORD
        sync: false

databases: # Render PostgreSQL database
  - name: soma-db
    region: ohio
    ipAllowList: [] # only allow internal connections
    plan: free # optional; defaults to starter
